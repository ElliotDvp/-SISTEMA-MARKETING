<!DOCTYPE html>
<html xmlns:tn="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiverADS Deals</title>
   <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f3f3;
        }
        header {
            background-color: #000; /* Fondo negro */
            color: #fff; /* Texto blanco */
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header nav a {
            color: #fff; /* Texto de los enlaces en blanco */
            text-decoration: none;
            margin: 0 15px;
        }
        .navbar img {
            width: 90px;
        }
        .categories {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 10px;
        }
        .categories button {
            background-color: white;
            border: none;
            font-size: 16px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .categories button:hover {
            background-color: #f3f3f3;
        }
        .categories .selected {
            background-color: #E60023; /* Rojo para botón seleccionado */
            color: white;
        }

        /* Estilos de la lista de productos */
        .products-grid {
            display: none;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .products-grid.active {
            display: flex;
        }

        .product-card {
            background-color: white;
            border: 1px solid #ddd;
            width: 22%;
            margin: 15px;
            text-align: center;
            padding: 15px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            height: auto;
        }

        .product-card p {
            margin: 10px 0;
        }

        .price {
            color: #E60023; /* Rojo para precios rebajados */
            font-weight: bold;
        }

        .old-price {
            text-decoration: line-through;
            color: #888;
        }

        .discount-badge {
            background-color: #E60023;
            color: white;
            padding: 5px;
            font-size: 12px;
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>

<body>
    <!-- Nuevo header integrado -->
    <header>
        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbWTljjntV4kxhh6iNT7p8yoo9zrkMIeqPqA&s" alt="FiverADS logo" style="width: 50px; height: 50px;">
        </div>
        <nav>

        </nav>
    </header>
<h1 th:text="${titulo}"></h1>

<table>
	<thead>
		<tr> 
			<th> id </th>
			<th>NOMBRE DE CAMPAÑA</th>
			<th> DESCRIPCION</th>
			<th> META DE VENTAS</th>
			<th> FECHA DE INICIO</th>
			<th> FECHA DE FIN DE CAMPAÑA</th>
			<th> SEGMENTO GEOGRAFICO</th>
			<th> FECHA DE CREACION</th>
		</tr>	
	</thead>
	<tbody>
		<tr th:each="campaña: ${campañas}">
			<td><a class="btn btn-primary btn-xs"
			    	th:href="@{/formP/} + ${campaña.id}" th:text="${campaña.id}"></a></td>
			<td th:text="${campaña.nombre_campaña}"> </td>
			<td th:text="${campaña.descripcion}"> </td>
			<td th:text="${campaña.meta_ventas}"> </td>
			<td th:text="${campaña.fec_inicio}"> </td>
			<td th:text="${campaña.fec_fin}"> </td>
			<td th:text="${campaña.segmento_geografico}"> </td>
			<td th:text="${campaña.fecCre}"> </td>
			
			<td>
				<a class="btn btn-primary" th:href="@{/formP/{id}(id=${campaña.id})}">Asignar Productos</a>
			</td>
			
			<td>
				<a class="btn btn-info" th:href="@{/listarP/{id}(id=${campaña.id})}">Ver Productos</a>
			</td>
		</tr>
	
	</tbody>
	

</table>
</body>
</html>
